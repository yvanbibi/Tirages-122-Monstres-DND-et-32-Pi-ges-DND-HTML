<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateurs de Dés - 122 Monstres & 32 Pièges</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            color: var(--accent-color);
            text-align: center;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            text-align: center;
        }

        .dice-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            width: 100%;
        }

        .dice-container {
            background-color: var(--card-bg);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s;
        }

        .dice-container.rolling {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            20% { transform: translate(-2px, -2px) rotate(-1deg); }
            40% { transform: translate(-2px, 2px) rotate(1deg); }
            60% { transform: translate(2px, -2px) rotate(0deg); }
            80% { transform: translate(0px, 0px) rotate(1deg); }
            100% { transform: translate(2px, -2px) rotate(-1deg); }
        }

        .dice-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .face-number {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 15px;
        }

        .icon-display {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .icon-display img {
            max-width: 90px;
            max-height: 90px;
            object-fit: contain;
        }

        .icon-name {
            font-size: 0.95rem;
            color: var(--text-muted);
            word-break: break-all;
            margin-bottom: 25px;
            min-height: 40px;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }

        button:hover {
            background-color: #7dd3fc;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Tableau de Tirage D&D</h1>
    <p>Effectuez vos tirages aléatoires pour le dé 122 Monstres ou le dé de 32 Pièges.</p>

    <div class="dice-wrapper">

        <div class="dice-container" id="diceBox122">

            <div class="icon-display">
                <img id="iconImg122" src="" alt="Icône Dé 122" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'48\' height=\'48\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%2338bdf8\' stroke-width=\'2\'><rect width=\'18\' height=\'18\' x=\'3\' y=\'3\' rx=\'2\'/><circle cx=\'9\' cy=\'9\' r=\'2\'/><path d=\'m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21\'/></svg>'">

            <div class="icon-name" id="iconName32">Prêt à lancer...</div>
            <button id="rollButton32" onclick="rollDice32()">Lancer le Piège (32)</button>
        </div>
    </div>

        const iconsData32 = [];
        for (let i = 1; i <= 32; i++) {
            const trap = trapDataRaw[i - 1];
            iconsData32.push({
                id: i,
                name: `${trap.name}_${i}`,
                path: `data:image/png;base64,${trap.b64}`
            });
        }

        // Fonction de tirage pour le Dé 122 Faces
        function rollDice122() {
            const rollButton = document.getElementById('rollButton122');
            const diceBox = document.getElementById('diceBox122');
            const faceNumberEl = document.getElementById('faceNumber122');
            const iconNameEl = document.getElementById('iconName122');
            const iconImgEl = document.getElementById('iconImg122');

            rollButton.disabled = true;
            diceBox.classList.add('rolling');

            let counter = 0;
            const maxCount = 20;
            const intervalTime = 60;

            const shuffleInterval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * iconsData122.length);
                const randomIcon = iconsData122[randomIndex];

                faceNumberEl.textContent = `Face #${randomIcon.id}`;
                iconNameEl.textContent = randomIcon.name;
                iconImgEl.src = randomIcon.path;

                counter++;
                if (counter >= maxCount) {
                    clearInterval(shuffleInterval);
                    const finalIndex = Math.floor(Math.random() * iconsData122.length);
                    const finalIcon = iconsData122[finalIndex];

                    diceBox.classList.remove('rolling');
                    faceNumberEl.textContent = `Face #${finalIcon.id} (Résultat)`;
                    iconNameEl.textContent = finalIcon.name;
                    iconImgEl.src = finalIcon.path;

                    rollButton.disabled = false;
                }
            }, intervalTime);
        }

        // Fonction de tirage pour le Dé 32 Pièges
        function rollDice32() {
            const rollButton = document.getElementById('rollButton32');
            const diceBox = document.getElementById('diceBox32');
            const faceNumberEl = document.getElementById('faceNumber32');
            const iconNameEl = document.getElementById('iconName32');
            const iconImgEl = document.getElementById('iconImg32');

            rollButton.disabled = true;
            diceBox.classList.add('rolling');

            let counter = 0;
            const maxCount = 20;
            const intervalTime = 60;

            const shuffleInterval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * iconsData32.length);
                const randomIcon = iconsData32[randomIndex];

                faceNumberEl.textContent = `Piège #${randomIcon.id}`;
                iconNameEl.textContent = randomIcon.name;
                iconImgEl.src = randomIcon.path;

                counter++;
                if (counter >= maxCount) {
                    clearInterval(shuffleInterval);
                    const finalIndex = Math.floor(Math.random() * iconsData32.length);
                    const finalIcon = iconsData32[finalIndex];

                    diceBox.classList.remove('rolling');
                    faceNumberEl.textContent = `Piège #${finalIcon.id} (Résultat)`;
                    iconNameEl.textContent = finalIcon.name;
                    iconImgEl.src = finalIcon.path;

                    rollButton.disabled = false;
                }
            }, intervalTime);
        }
